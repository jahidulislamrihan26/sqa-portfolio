name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # nightly: catches changes in the public sites under test

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: api-testing
      - run: npm test
        working-directory: api-testing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-reports
          path: api-testing/reports

  ui:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
        working-directory: automation-testing
      - run: npm run typecheck
        working-directory: automation-testing
      # The one-time login setup runs in Chromium, so every matrix job needs it as well as its own browser.
      - run: npx playwright install --with-deps chromium ${{ matrix.browser }}
        working-directory: automation-testing
      - run: npx playwright test --project=${{ matrix.browser }}
        working-directory: automation-testing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            automation-testing/playwright-report
            automation-testing/reports

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: grafana/setup-k6-action@v1
      - run: node tools/run-all.js --profile ci
        working-directory: performance-testing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-reports
          path: performance-testing/results
